name: Build WLED firmware (esp32dev + bambu_chamber_light)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # pushing a version tag also cuts a GitHub Release
  workflow_dispatch: {}      # lets you re-trigger a build manually from the Actions tab

permissions:
  contents: write            # needed for the "attach to Release" step on tag builds

env:
  WLED_REPO: wled/WLED
  WLED_REF: v16.0.1        # pin to a known-good WLED release; bump deliberately when you want to update
  USERMOD_NAME: wled-bambu-chamber-light
  PIO_ENV: esp32dev_bambu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this usermod repo
        uses: actions/checkout@v4
        with:
          path: usermod-src

      - name: Checkout WLED (${{ env.WLED_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WLED_REPO }}
          ref: ${{ env.WLED_REF }}
          path: wled

      - name: Drop the usermod into WLED's usermods/ folder
        run: |
          mkdir -p "wled/usermods/${USERMOD_NAME}"
          cp usermod-src/*.cpp usermod-src/*.h usermod-src/library.json "wled/usermods/${USERMOD_NAME}/"

      - name: Write platformio_override.ini
        run: |
          # WLED's stock ESP32 build never links the mbedTLS SSL module (nothing
          # in WLED core does TLS), so the esp_tls calls this usermod's
          # bambu_tls_client.h makes leave mbedtls_ssl_* undefined at link time.
          # Append the three mbedTLS archives *after* the framework libs.
          cat > wled/link_mbedtls.py <<'PY'
          Import("env")
          import os, glob, subprocess
          sdk_lib = os.path.join(env.subst("$PROJECT_PACKAGES_DIR"),
                                 "framework-arduinoespressif32", "tools", "sdk", "esp32", "lib")
          alla = sorted(glob.glob(os.path.join(sdk_lib, "*.a")))
          print("[diag] sdk_lib=%s (%d archives)" % (sdk_lib, len(alla)))
          nm = env.subst("$CC").replace("gcc", "nm")
          want = "mbedtls_ssl_handshake"
          providers = []
          for a in alla:
              try:
                  out = subprocess.check_output([nm, "-A", "--defined-only", a],
                                                stderr=subprocess.DEVNULL).decode("utf-8", "ignore")
              except Exception as e:
                  continue
              if want in out and (" T " + want in out or " W " + want in out):
                  providers.append(os.path.basename(a))
          print("[diag] archives defining %s: %s" % (want, providers))
          print("[diag] TLS-ish archives present: %s" %
                [os.path.basename(p) for p in alla
                 if any(k in os.path.basename(p) for k in ("mbed","bear","tls","ssl","wolf","crypto"))])
          PY

          cat > wled/platformio_override.ini <<EOF
          [platformio]
          default_envs = ${PIO_ENV}

          [env:${PIO_ENV}]
          extends = env:esp32dev
          custom_usermods = \${env:esp32dev.custom_usermods} ${USERMOD_NAME}
          build_flags = \${env:esp32dev.build_flags} -D WLED_RELEASE_NAME=\"ESP32_BambuChamberLight\"
          extra_scripts = \${scripts_defaults.extra_scripts}
            post:link_mbedtls.py
          EOF
          echo "--- generated wled/platformio_override.ini ---"
          cat wled/platformio_override.ini
          echo "--- generated wled/link_mbedtls.py ---"
          cat wled/link_mbedtls.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: wled
        run: pio run -e ${{ env.PIO_ENV }}

      - name: Stage firmware under a friendly name
        run: |
          mkdir -p dist
          cp "wled/.pio/build/${PIO_ENV}/firmware.bin" \
             "dist/WLED_${PIO_ENV}_${GITHUB_REF_NAME}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLED_${{ env.PIO_ENV }}_${{ github.ref_name }}
          path: dist/*.bin
          if-no-files-found: error

      - name: Attach firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
