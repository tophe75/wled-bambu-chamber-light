name: Build WLED firmware (esp32dev + bambu_chamber_light)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # pushing a version tag also cuts a GitHub Release
  workflow_dispatch: {}      # lets you re-trigger a build manually from the Actions tab

permissions:
  contents: write            # needed for the "attach to Release" step on tag builds

env:
  WLED_REPO: wled/WLED
  WLED_REF: v16.0.1        # pin to a known-good WLED release; bump deliberately when you want to update
  USERMOD_NAME: wled-bambu-chamber-light
  PIO_ENV: esp32dev_bambu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this usermod repo
        uses: actions/checkout@v4
        with:
          path: usermod-src

      - name: Checkout WLED (${{ env.WLED_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WLED_REPO }}
          ref: ${{ env.WLED_REF }}
          path: wled

      - name: Drop the usermod into WLED's usermods/ folder
        run: |
          mkdir -p "wled/usermods/${USERMOD_NAME}"
          cp usermod-src/*.cpp usermod-src/*.h usermod-src/library.json "wled/usermods/${USERMOD_NAME}/"

      - name: Write platformio_override.ini and the mbedTLS-SSL fetch script
        run: |
          # WLED's ESP32 framework ships mbedTLS as crypto-only: the SSL/TLS
          # record + handshake layer (mbedtls_ssl_*) is in no framework archive,
          # and there is no WiFiClientSecure. This pre: script drops the exact
          # matching mbedTLS ssl_*.c sources into the usermod so they compile
          # with it and link against the framework's libmbedcrypto/libmbedx509.
          cat > wled/fetch_mbedtls_ssl.py <<'PY'
          Import("env")
          import os, re, glob, urllib.request

          umdir = os.path.join(env.subst("$PROJECT_DIR"), "usermods", "wled-bambu-chamber-light")
          pkgs  = env.subst("$PROJECT_PACKAGES_DIR")

          # 1. exact mbedTLS version bundled with this framework -> git tag
          ver = None
          for vh in glob.glob(os.path.join(pkgs, "framework-arduinoespressif32", "**", "mbedtls", "version.h"),
                              recursive=True):
              m = re.search(r'MBEDTLS_VERSION_STRING\s+"([0-9.]+)"', open(vh).read())
              if m:
                  ver = m.group(1)
                  break
          if not ver:
              raise SystemExit("[fetch_mbedtls_ssl] could not find framework mbedTLS version.h")
          tag = "v" + ver
          print("[fetch_mbedtls_ssl] framework mbedTLS %s -> tag %s" % (ver, tag))

          # 2. minimal set for a TLS 1.2 client: 4 SSL impl files + constant_time,
          #    plus the private library/ headers they include.
          base = "https://raw.githubusercontent.com/Mbed-TLS/mbedtls/%s/library/" % tag
          for fn in ("common.h", "constant_time_internal.h", "constant_time_invasive.h",
                     "constant_time.c", "ssl_ciphersuites.c", "ssl_cli.c", "ssl_msg.c", "ssl_tls.c"):
              dst = os.path.join(umdir, fn)
              if not os.path.exists(dst):
                  print("[fetch_mbedtls_ssl] GET " + base + fn)
                  urllib.request.urlretrieve(base + fn, dst)

          # 3. compile everything with the framework's own mbedTLS config so the
          #    struct layouts match the prebuilt libmbedcrypto/libmbedx509.
          defs = [d[0] if isinstance(d, (list, tuple)) else d for d in env.get("CPPDEFINES", [])]
          print("[fetch_mbedtls_ssl] MBEDTLS_CONFIG_FILE already defined:", "MBEDTLS_CONFIG_FILE" in defs)
          if "MBEDTLS_CONFIG_FILE" not in defs:
              env.Append(CPPDEFINES=[("MBEDTLS_CONFIG_FILE", '\\"mbedtls/esp_config.h\\"')])

          # 4. make sure the crypto/x509 archives are on the link line for our ssl_*.o
          sdk_lib = os.path.join(pkgs, "framework-arduinoespressif32", "tools", "sdk", "esp32", "lib")
          for a in ("libmbedx509.a", "libmbedcrypto.a"):
              p = os.path.join(sdk_lib, a)
              if os.path.exists(p):
                  env.Append(LIBS=[env.File(p)])
          env.Append(LINKFLAGS=["-Wl,--allow-multiple-definition"])
          PY

          cat > wled/platformio_override.ini <<EOF
          [platformio]
          default_envs = ${PIO_ENV}

          [env:${PIO_ENV}]
          extends = env:esp32dev
          custom_usermods = \${env:esp32dev.custom_usermods} ${USERMOD_NAME}
          build_flags = \${env:esp32dev.build_flags} -D WLED_RELEASE_NAME=\"ESP32_BambuChamberLight\"
          extra_scripts = \${scripts_defaults.extra_scripts}
            pre:fetch_mbedtls_ssl.py
          EOF
          echo "--- generated wled/platformio_override.ini ---"; cat wled/platformio_override.ini
          echo "--- generated wled/fetch_mbedtls_ssl.py ---";   cat wled/fetch_mbedtls_ssl.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: wled
        run: pio run -e ${{ env.PIO_ENV }}

      - name: Stage firmware under a friendly name
        run: |
          mkdir -p dist
          cp "wled/.pio/build/${PIO_ENV}/firmware.bin" \
             "dist/WLED_${PIO_ENV}_${GITHUB_REF_NAME}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLED_${{ env.PIO_ENV }}_${{ github.ref_name }}
          path: dist/*.bin
          if-no-files-found: error

      - name: Attach firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
