name: Build WLED firmware (esp32dev + bambu_chamber_light)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # pushing a version tag also cuts a GitHub Release
  workflow_dispatch: {}      # lets you re-trigger a build manually from the Actions tab

permissions:
  contents: write            # needed for the "attach to Release" step on tag builds

env:
  WLED_REPO: wled/WLED
  WLED_REF: v16.0.1        # pin to a known-good WLED release; bump deliberately when you want to update
  USERMOD_NAME: wled-bambu-chamber-light
  PIO_ENV: esp32dev_bambu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this usermod repo
        uses: actions/checkout@v4
        with:
          path: usermod-src

      - name: Checkout WLED (${{ env.WLED_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WLED_REPO }}
          ref: ${{ env.WLED_REF }}
          path: wled

      - name: Drop the usermod into WLED's usermods/ folder
        run: |
          mkdir -p "wled/usermods/${USERMOD_NAME}"
          cp usermod-src/*.cpp usermod-src/library.json "wled/usermods/${USERMOD_NAME}/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Install the WLED platform/framework packages
        working-directory: wled
        # Do this before writing platformio_override.ini so the ESP32 framework
        # (and its bundled WiFiClientSecure library) is unpacked on disk and we
        # can point lib_deps straight at it.
        run: pio pkg install -e esp32dev

      - name: Write platformio_override.ini
        run: |
          FW_LIBS="$(find "$HOME/.platformio/packages" -maxdepth 2 -type d -name libraries -path '*framework-arduinoespressif32*' | head -1)"
          echo "framework libraries dir: $FW_LIBS"
          test -d "$FW_LIBS/WiFiClientSecure" || { echo "WiFiClientSecure not found in framework!"; ls "$FW_LIBS"; exit 1; }
          cat > wled/platformio_override.ini <<EOF
          [platformio]
          default_envs = ${PIO_ENV}

          [env:${PIO_ENV}]
          extends = env:esp32dev
          custom_usermods = \${env:esp32dev.custom_usermods} ${USERMOD_NAME}
          build_flags = \${env:esp32dev.build_flags} -D WLED_RELEASE_NAME=\"ESP32_BambuChamberLight\"
          ; Only this usermod pulls in <WiFiClientSecure.h>. WLED core never
          ; includes it, so PlatformIO's default "chain" dependency finder never
          ; adds that bundled ESP32-framework library to the build graph, and
          ; naming it in library.json just makes PIO look for a (non-existent)
          ; registry package. Point lib_deps straight at the framework's own
          ; copy so it gets compiled and put on the include path.
          lib_deps =
            \${env:esp32dev.lib_deps}
            ${FW_LIBS}/WiFiClientSecure
          EOF
          echo "--- generated wled/platformio_override.ini ---"
          cat wled/platformio_override.ini

      - name: Build firmware
        working-directory: wled
        run: pio run -e ${{ env.PIO_ENV }}

      - name: Stage firmware under a friendly name
        run: |
          mkdir -p dist
          cp "wled/.pio/build/${PIO_ENV}/firmware.bin" \
             "dist/WLED_${PIO_ENV}_${GITHUB_REF_NAME}.bin"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLED_${{ env.PIO_ENV }}_${{ github.ref_name }}
          path: dist/*.bin
          if-no-files-found: error

      - name: Attach firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
